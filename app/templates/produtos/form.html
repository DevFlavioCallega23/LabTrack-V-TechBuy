{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3><i class="bi bi-box-seam"></i> {{ 'Editar Produto' if produto else 'Novo Produto' }}</h3>
    <a href="{{ url_for('produtos.index') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Voltar</a>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label">Componente *</label>
                        <div class="input-group">
                            <select name="component_type" id="componentType" class="form-select" required>
                                <option value="">Selecione...</option>
                                {% for val, label in tipos %}
                                <option value="{{ val }}" {% if produto and produto.component_type == val %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                                {% if produto and tipos|map(attribute=0)|list and produto.component_type not in tipos|map(attribute=0)|list %}
                                <option value="{{ produto.component_type }}" selected>{{ produto.component_type }} (atual)</option>
                                {% endif %}
                            </select>
                            <button type="button" class="btn btn-outline-info" data-bs-toggle="modal" data-bs-target="#novoTipoModal" title="Adicionar novo tipo">
                                <i class="bi bi-plus-lg"></i>
                            </button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Modelo *</label>
                        <input type="text" name="model_name" class="form-control" required
                               placeholder="Ex: 8GB DDR3 Kingston, SSD 480GB A400..."
                               value="{{ produto.model_name if produto else '' }}">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> {{ 'Salvar' if produto else 'Cadastrar' }}</button>
                        <a href="{{ url_for('produtos.index') }}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="novoTipoModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-plus-circle"></i> Novo Tipo de Componente</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Nome do Tipo *</label>
                    <input type="text" id="novoTipoLabel" class="form-control" placeholder="Ex: Gabinete, Cooler, Mouse...">
                </div>
                <div class="mb-3">
                    <label class="form-label">Chave (automático)</label>
                    <input type="text" id="novoTipoKey" class="form-control bg-secondary" readonly>
                    <small class="text-secondary">Gerada automaticamente a partir do nome.</small>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="adicionarNovoTipo()"><i class="bi bi-check-lg"></i> Adicionar</button>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('novoTipoLabel').addEventListener('input', function() {
    const key = this.value.toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '_')
        .replace(/^_|_$/g, '');
    document.getElementById('novoTipoKey').value = key;
});

function adicionarNovoTipo() {
    const label = document.getElementById('novoTipoLabel').value.trim();
    const key = document.getElementById('novoTipoKey').value.trim();
    if (!label || !key) {
        alert('Preencha o nome do tipo.');
        return;
    }
    const select = document.getElementById('componentType');
    const exists = Array.from(select.options).some(o => o.value === key);
    if (exists) {
        alert('Este tipo já existe.');
        return;
    }
    const option = new Option(label, key, true, true);
    select.add(option);
    bootstrap.Modal.getInstance(document.getElementById('novoTipoModal')).hide();
    document.getElementById('novoTipoLabel').value = '';
    document.getElementById('novoTipoKey').value = '';
}
</script>
{% endblock %}
