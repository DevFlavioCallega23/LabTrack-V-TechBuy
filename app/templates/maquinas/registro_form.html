{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3><i class="bi bi-person-plus"></i> {{ 'Editar Registro' if registro else 'Novo Registro' }}</h3>
    <a href="{{ url_for('maquinas.index') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Voltar
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" autocomplete="off">
            <div class="sticky-top bg-dark py-2 mb-3 border-bottom border-secondary d-flex justify-content-between align-items-center" style="z-index:1020">
                <span class="fw-bold text-light">
                    <i class="bi bi-person-plus"></i> {{ 'Editando ' + registro.nome if registro else 'Novo Registro' }}
                </span>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary btn-sm">
                        <i class="bi bi-check-lg"></i> {{ 'Atualizar' if registro else 'Criar Registro' }}
                    </button>
                    <a href="{{ url_for('maquinas.index') }}" class="btn btn-outline-secondary btn-sm">Cancelar</a>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold"><i class="bi bi-person"></i> Pessoa</label>
                    <input type="text" name="nome" class="form-control" placeholder="Ex: Natali" value="{{ registro.nome if registro else '' }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold"><i class="bi bi-calendar3"></i> Data</label>
                    <input type="text" name="data" class="form-control date-mask" placeholder="DD/MM/AAAA" value="{{ registro.data or '' if registro else '' }}">
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
