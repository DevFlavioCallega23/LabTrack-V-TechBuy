{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3><i class="bi bi-person-plus"></i> {{ 'Editar Registro' if registro else 'Novo Registro' }}</h3>
    <a href="{{ url_for('maquinas.index') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Voltar
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" class="row g-3" autocomplete="off">
            <div class="col-md-6">
                <label class="form-label">Pessoa</label>
                <input type="text" name="nome" class="form-control" placeholder="Ex: Natali" value="{{ registro.nome if registro else '' }}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Data</label>
                <input type="text" name="data" class="form-control date-mask" placeholder="DD/MM/AA" value="{{ registro.data or '' if registro else '' }}">
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Salvar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
